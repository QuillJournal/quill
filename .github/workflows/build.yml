name: Build Android (Debug & Release)

on:
  workflow_dispatch:
  push:

jobs:
  android:
    name: Build Android (Debug & Release)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Allocate adequate JVM heap to prevent aggressive GC cycles on the 2-core runner
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Force debug signing on release builds
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          # Fallback if Expo generated signingConfig with debug under a condition or omitted it:
          if ! grep -q "signingConfig signingConfigs.debug" android/app/build.gradle; then
            sed -i '/buildTypes {/,/release {/ { /release {/a \            signingConfig signingConfigs.debug
            }' android/app/build.gradle
          fi

      - name: Build Debug & Release APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
