<head>
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <style>
    div {
      font-family: sans-serif;
    }
    button {
      font-size: 18px;
      background-color: rgb(0 128 0);
      color: white;
      border-radius: 12px;
      border: 0px;
      padding: 12px;
      box-shadow: 10px;
    }
    @media (prefers-color-scheme: dark) {
      div {
        color: white;
      }
    }
  </style>
</head>
<body>
  <div>
    <h1>Password Changed.</h1>
    <p>
      Your Quill password for {{ .Email }} was changed. You can now login to
      Quill with your new password.
    </p>
    <p>
      If this <i>wasn't</i> done by you, please reset your password immediately
      and/or contact support.
    </p>
    <a href="mailto:quill@nicesapien.dev"><button>Contact support</button></a>
    <p>
      Regards, <br />
      the Quill Team
    </p>
  </div>
</body>
